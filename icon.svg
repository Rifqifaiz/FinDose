<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching reference image -->
    <linearGradient id="bgGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#558d80" />
      <stop offset="35%" stop-color="#41776c" />
      <stop offset="70%" stop-color="#2d6058" />
      <stop offset="100%" stop-color="#1e4d46" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded background matching iOS / modern app icon -->
  <rect width="512" height="512" rx="136" fill="url(#bgGrad)" />

  <!-- Main Emblem Group: Centered and rotated along the 45-degree diagonal -->
  <g transform="translate(256 256) rotate(45) translate(-256 -256)">

    <!-- 1. Bottom Closed Half of Capsule (U-shaped cup with flat waistline) -->
    <path d="M 162 254
             L 350 254
             L 350 330
             A 94 94 0 0 1 162 330
             Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 2. Top Capsule Outer Dome Outline -->
    <path d="M 350 224
             L 350 178
             A 94 94 0 0 0 162 178
             L 162 216"
          fill="none"
          stroke="#ffffff"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 3. Inner Secondary Arc on Top-Left (shell / reflection highlight) -->
    <path d="M 196 222
             L 196 178
             A 60 60 0 0 1 292 126"
          fill="none"
          stroke="#ffffff"
          stroke-width="20"
          stroke-linecap="round" />

    <!-- 4. Dollar Sign ($) positioned centered in the top half -->
    <!-- Vertical Spine passing through center x=256 -->
    <line x1="256" y1="126" x2="256" y2="242"
          stroke="#ffffff"
          stroke-width="20"
          stroke-linecap="round" />

    <!-- Smooth S Curve of $ -->
    <path d="M 284 162
             C 284 142 272 136 256 136
             C 236 136 226 146 226 160
             C 226 182 286 182 286 208
             C 286 224 274 234 256 234
             C 238 234 228 226 228 208"
          fill="none"
          stroke="#ffffff"
          stroke-width="21"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
